name: Python Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Compile & validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Compile all Python sources
        run: python -m compileall -q src

      - name: Validate YAML configs and citation metadata
        run: |
          python -c "import glob, yaml; files = sorted(glob.glob('config/*.yaml')) + ['CITATION.cff']; [yaml.safe_load(open(f, encoding='utf-8')) for f in files]; print('Validated:', *files)"
